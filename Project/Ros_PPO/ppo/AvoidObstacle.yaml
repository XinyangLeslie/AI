behaviors:
  AvoidAgent:
    trainer_type: ppo
    time_horizon: 64
    max_steps: 5e6
    hyperparameters:
      batch_size: 1024
      buffer_size: 4096
      learning_rate: 3e-4
      beta: 5e-3
      epsilon: 0.2
    network_settings:
      normalize: true
      hidden_units: 128
      num_layers: 2
      vis_encode_type: simple
    reward_signals:
      extrinsic:
        gamma: 0.99
        strength: 1.0
