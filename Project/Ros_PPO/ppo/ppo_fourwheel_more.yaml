env_settings:
  env_path: "EXE/MyPenguins.exe"
  num_envs: 4
  base_port: 5005

behaviors:
  FourWheelAgent:
    trainer_type: ppo
    hyperparameters:
      batch_size: 128
      buffer_size: 20480
      learning_rate: 3.0e-4
      beta: 5.0e-4
      epsilon: 0.2
      lambd: 0.95
      num_epoch: 3
    network_settings:
      normalize: false
      hidden_units: 128
      num_layers: 2
    reward_signals:
      extrinsic:
        gamma: 0.99
        strength: 1.0
    max_steps: 5.0e5
    time_horizon: 64
    summary_freq: 5000
